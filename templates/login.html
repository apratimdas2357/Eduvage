{% extends "base.html" %}

{% block title %}Eduvage - Login{% endblock %}

{% block content %}
<div class="flex h-screen bg-white">

    <!-- Left Panel (Login Form) -->
    <div class="w-full md:w-1/2 flex flex-col justify-center px-10 md:px-24 lg:px-32 relative z-10">

        <!-- Logo -->
        <div class="mb-8">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Eduvage Logo" class="w-20 h-auto">
        </div>

        <h1 class="text-4xl lg:text-5xl font-bold mb-4">Welcome back,</h1>

        <!-- Role Tabs -->
        <div class="flex space-x-4 text-2xl lg:text-3xl font-bold mb-10 border-b border-gray-200 pb-2 w-max" id="roleTabs">
            <a href="#" data-role="teacher" class="role-tab text-gray-400 hover:text-gray-600 transition pb-1">Teacher</a>
            <a href="#" data-role="student" class="role-tab text-black border-b-4 border-black pb-1">Student</a>
            <a href="#" data-role="admin" class="role-tab text-gray-400 hover:text-gray-600 transition pb-1">Admin</a>
        </div>

        <!-- Form -->
        <form action="/" method="POST" class="w-full max-w-sm">
            <input type="hidden" name="role" id="roleInput" value="student">
            <div class="mb-4">
                <div class="w-full border-b border-black">
                    <input type="text" name="user_id" placeholder="Enter User ID (Email or Roll No)" class="w-full py-2 outline-none text-lg bg-transparent" required>
                </div>
            </div>
            <div class="flex items-end mb-8 space-x-4">
                <div class="w-full border-b border-black">
                    <input type="password" name="password" placeholder="Enter Password" class="w-full py-2 outline-none text-lg bg-transparent" required>
                </div>
                <button type="submit" class="bg-primary text-white font-bold py-3 px-8 text-xl rounded-sm hover:bg-primaryHover transition">
                    Login
                </button>
            </div>
            {% if error %}
            <p class="text-red-500 text-sm mt-2">{{ error }}</p>
            {% endif %}
        </form>

        <!-- Links -->
        <div class="mt-8">
            <a href="{{ url_for('apply') }}" class="text-primary font-bold underline underline-offset-4 hover:text-primaryHover transition">Apply as a new student!</a>
        </div>

    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const tabs = document.querySelectorAll('.role-tab');
        const roleInput = document.getElementById('roleInput');

        tabs.forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.preventDefault();

                // Reset all tabs
                tabs.forEach(t => {
                    t.className = 'role-tab text-gray-400 hover:text-gray-600 transition pb-1';
                });

                // Set active tab
                tab.className = 'role-tab text-black border-b-4 border-black pb-1';

                // Update hidden input
                roleInput.value = tab.getAttribute('data-role');
            });
        });
    });
</script>

    <!-- Right Panel (Geometric Shapes) -->
    <div class="hidden md:flex md:w-1/2 bg-white relative overflow-hidden h-full items-center justify-center">
        <!-- We can use SVG or CSS shapes to replicate the specific geometric pattern in the image -->
        <!-- Based on `Gemini_Generated_Image...png` the right side has a dark purple right-half and white slash patterns overlaying it -->

        <!-- Background right side -->
        <div class="absolute right-0 top-0 w-3/4 h-full bg-primary z-0"></div>

        <!-- Slashes -->
        <div class="relative z-10 w-full h-full">
            <svg width="100%" height="100%" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <!-- Large white slash -->
                <polygon points="600,250 800,100 800,450 600,600" fill="white" />

                <!-- Purple slash crossing it -->
                <polygon points="400,450 600,250 600,400 400,600" fill="#3a358c" />

                <!-- Bottom white slash -->
                <polygon points="600,700 800,500 800,800" fill="white" />
                <!-- More patterns to match roughly the design -->
                <polygon points="500,600 600,500 600,700 500,800" fill="#3a358c" />
                <polygon points="600,100 600,300 500,400 500,200" fill="white" />
            </svg>
        </div>
    </div>
</div>
{% endblock %}
